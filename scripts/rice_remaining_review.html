<script>
/* Names describe the annotation class, never a diagnosis inferred from a folder. */
(function (global) {
  'use strict';
  const thai = Object.freeze({
    Bacterial_Blight: 'โรคขอบใบแห้ง', Brown_Spot: 'โรคใบจุดสีน้ำตาล',
    Rice_Blast: 'โรคไหม้', Narrow_Brown_Spot: 'โรคใบขีดสีน้ำตาล',
    False_Smut: 'โรคดอกกระถิน', Dirty_Seed: 'โรคเมล็ดด่าง',
    Sheath_Rot: 'โรคกาบใบเน่า', Stem_Rot: 'โรคลำต้นเน่า',
    Red_Stripe: 'โรคใบแถบแดง', Tungro: 'โรคใบสีส้ม'
  });
  const colors = ['#37e5a3','#ffcd43','#78c4ff','#ff95cc','#c6abff',
    '#ffab70','#bce77b','#86e4e4','#ff8282','#ffe56b'];
  function name(id, names) {
    const en = names[id];
    return en ? `${thai[en] || en} · ${en} · class ${id}` : `class ${id} · ยังไม่มีชื่อในชุดนี้`;
  }
  function color(id) { return colors[((Number(id) % colors.length) + colors.length) % colors.length]; }
  function summary(objects, names) {
    return [...new Set(objects.map(o => Number(o.class_id)))].sort((a,b)=>a-b)
      .map(id => name(id, names)).join(' / ');
  }
  function draw(canvas, img, objects, names, options = {}) {
    // A consistent drawing size keeps names readable even for 224px source images.
    const width = 1200, height = Math.round(width * img.naturalHeight / img.naturalWidth);
    const ids = [...new Set(objects.map(o => Number(o.class_id)))].sort((a,b)=>a-b);
    const legendHeight = ids.length ? 18 + ids.length * 50 : (options.emptyText ? 63 : 0);
    canvas.width = width; canvas.height = height + legendHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    const groups = new Map();
    for (const o of objects) {
      const points = o.polygon;
      if (!points || points.length < 3) continue;
      const id = Number(o.class_id), col = color(id);
      ctx.beginPath(); points.forEach(([x,y],i)=>i ? ctx.lineTo(x*width,y*height) : ctx.moveTo(x*width,y*height));
      ctx.closePath(); ctx.fillStyle = col + '35'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
      const xs = points.map(p=>p[0]), ys = points.map(p=>p[1]);
      const box = {x: Math.min(...xs)*width, y: Math.min(...ys)*height,
        right: Math.max(...xs)*width, bottom: Math.max(...ys)*height};
      box.area = (box.right-box.x)*(box.bottom-box.y);
      if (!groups.has(id) || box.area > groups.get(id).area) groups.set(id, box);
    }
    // One full name per class avoids burying small lesions under repeated text.
    // Every region of that class shares the same color and the legend counts all regions.
    const occupied = [];
    ctx.font = 'bold 35px system-ui, sans-serif'; ctx.textBaseline = 'middle';
    for (const [id, box] of groups) {
      const text = name(id, names), pad = 12, h = 59;
      const w = Math.min(width-16, ctx.measureText(text).width+pad*2);
      const x = Math.min(width-w-8, Math.max(8, box.x));
      let y = Math.max(8, Math.min(height-h-8, box.y-h-8));
      for (let tries=0; tries<ids.length; tries++) {
        if (!occupied.some(r=>x<r.x+r.w && x+w>r.x && y<r.y+r.h && y+h>r.y)) break;
        y = Math.min(height-h-8, y+h+6);
      }
      occupied.push({x,y,w,h});
      ctx.fillStyle='#10281fec'; ctx.fillRect(x,y,w,h);
      ctx.strokeStyle=color(id); ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
      ctx.fillStyle=color(id); ctx.fillText(text,x+pad,y+h/2,w-pad*2);
      ctx.beginPath(); ctx.moveTo(x+Math.min(w/2,40),y+h);
      ctx.lineTo(Math.max(box.x,Math.min(box.right,x+40)),Math.max(box.y,Math.min(box.bottom,y+h)));
      ctx.stroke();
    }
    if (legendHeight) {
      ctx.fillStyle='#10281f'; ctx.fillRect(0,height,width,legendHeight);
      ctx.font='30px system-ui, sans-serif'; ctx.textBaseline='middle';
      ids.forEach((id,i)=>{
        const count=objects.filter(o=>Number(o.class_id)===id).length;
        ctx.fillStyle=color(id); ctx.fillRect(16,height+20+i*50,14,23);
        ctx.fillText(`${name(id,names)}  ·  ${count} ขอบเขต`,43,height+31+i*50,width-60);
      });
      if (!ids.length) { ctx.fillStyle='#d7e7dd'; ctx.fillText(options.emptyText,20,height+31,width-40); }
    }
    canvas.setAttribute('aria-label', summary(objects,names) || options.emptyText || 'ภาพต้นฉบับ');
  }
  global.RiceClassNames = Object.freeze({thai, name, color, summary, draw});
})(globalThis);

</script>
<!-- END CLASS NAME RENDERER -->
<script>
const $=id=>document.getElementById(id);let rows=[],visible=[],page=0,detailIndex=0,sequence=0;const size=24;
const names=['Bacterial_Blight','Brown_Spot','Rice_Blast','Narrow_Brown_Spot','False_Smut','Dirty_Seed','Sheath_Rot','Stem_Rot','Red_Stripe'];
const labels={unsupported_new_class:'โรคใหม่ — โมเดลเดิมไม่รองรับ',nearly_empty_black_crop:'ภาพเกือบดำล้วน',crop_candidates_need_review:'พบกรอบเสนอใหม่ — ต้องตรวจแก้',no_usable_crop_prediction:'ซูมตรวจแล้ว ยังไม่พบกรอบที่ใช้ได้',resolved_after_manual_fix:'แก้ขอบเขตเพิ่มแล้ว — มีไฟล์ label'};
function apply(){let rs=rows.filter(r=>(!r.training_label_approved||$('status').value==='resolved_after_manual_fix')&&(!$('group').value||r.group===$('group').value)&&(!$('folder').value||r.source_folder===$('folder').value)&&(!$('status').value||r.status===$('status').value));const q=$('search').value.trim().toLowerCase();rs=rs.filter(r=>!q||(r.source+' '+r.id).toLowerCase().includes(q));if($('dedup').checked){const seen=new Set();rs=rs.filter(r=>{if(seen.has(r.sha256))return false;seen.add(r.sha256);return true;});}visible=rs;page=0;render();}
function render(){$('count').textContent=`แสดง ${visible.length.toLocaleString()} ไฟล์ จากชุดที่นำมาตรวจซ้ำ ${rows.length.toLocaleString()} ไฟล์`;$('grid').replaceChildren();for(const r of visible.slice(page*size,(page+1)*size)){const card=document.createElement('article');card.className='card';const picture=document.createElement('button');picture.className='picture';picture.setAttribute('aria-label','ดูภาพ '+r.filename);const img=document.createElement('img');img.src=r.image;img.alt=r.source_folder+' '+r.filename;img.loading='lazy';picture.append(img);picture.onclick=()=>openDetail(r.id);card.append(picture);const body=document.createElement('div');body.className='body';const title=document.createElement('strong');title.textContent=r.source_folder;body.append(title);const fn=document.createElement('div');fn.className='filename';fn.textContent=r.filename;body.append(fn);const badge=document.createElement('span');badge.className='badge'+(r.group==='new'?' new':'');badge.textContent=labels[r.status];body.append(badge);const reason=document.createElement('p');reason.className='reason';reason.textContent=r.reason;body.append(reason);const info=document.createElement('p');info.className='small';info.textContent=`${r.width}×${r.height} พิกเซล · ${r.candidate_count} ขอบเขต${r.duplicate_count>1?' · มีไฟล์เนื้อหาเดียวกัน '+r.duplicate_count+' ไฟล์':''}`;body.append(info);const button=document.createElement('button');button.className='view';button.textContent='ดูภาพใหญ่และเหตุผล';button.onclick=()=>openDetail(r.id);body.append(button);card.append(body);$('grid').append(card);}$('page').textContent=`หน้า ${visible.length?page+1:0} / ${Math.ceil(visible.length/size)}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=visible.length;}
async function openDetail(id){detailIndex=visible.findIndex(r=>r.id===id);if(detailIndex<0)return;const r=visible[detailIndex],token=++sequence;$('title').textContent=r.source_folder+' · '+r.filename;$('detailreason').textContent=r.reason;$('metadata').textContent=`ขนาดต้นฉบับ: ${r.width}×${r.height} พิกเซล\nผลตรวจ: ${labels[r.status]}\nรหัสรูป: ${r.id}\nที่มา: ${r.source}\n${r.visual_note||''}`;$('original').href=r.image;$('fullimage').src=r.image;$('detailprev').disabled=detailIndex===0;$('detailnext').disabled=detailIndex===visible.length-1;if(!$('detail').open)$('detail').showModal();const [data,img]=await Promise.all([fetch(r.candidate_file).then(x=>x.json()),new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=r.image;})]);if(token!==sequence)return;RiceClassNames.draw($('overlay'),img,data.objects,names);}
for(const id of ['group','folder','status','dedup'])$(id).onchange=apply;$('search').oninput=apply;
$('prev').onclick=()=>{if(page>0){page--;render();window.scrollTo({top:0,behavior:'smooth'});}};$('next').onclick=()=>{if((page+1)*size<visible.length){page++;render();window.scrollTo({top:0,behavior:'smooth'});}};
function chip(group,status){$('group').value=group;$('status').value=status;$('folder').value='';$('search').value='';apply();}$('all').onclick=()=>chip('','');$('old').onclick=()=>chip('old','');$('new').onclick=()=>chip('new','');$('candidates').onclick=()=>chip('old','crop_candidates_need_review');$('blank').onclick=()=>chip('','nearly_empty_black_crop');$('fixed').onclick=()=>chip('','resolved_after_manual_fix');$('close').onclick=()=>$('detail').close();$('detailprev').onclick=()=>{if(detailIndex>0)openDetail(visible[detailIndex-1].id);};$('detailnext').onclick=()=>{if(detailIndex<visible.length-1)openDetail(visible[detailIndex+1].id);};
Promise.all([fetch('review_manifest.json').then(x=>x.json()),fetch('summary.json').then(x=>x.json())]).then(([r,s])=>{rows=r;for(const folder of [...new Set(rows.map(x=>x.source_folder))]){const o=document.createElement('option');o.value=folder;o.textContent=folder;$('folder').append(o);}$('summary').textContent=`ตรวจซ้ำ ${s.checked_files} ไฟล์ · แก้เพิ่ม ${s.visually_checked_additions_files} ไฟล์ · ยังไม่สำเร็จ ${s.remaining_after_manual_review} ไฟล์`;$('notice').textContent='โรคใหม่ 145 ไฟล์ไม่ได้หมายความว่ารูปเสีย แต่โมเดลเดิมยังไม่มีชื่อคลาส ส่วนกลุ่มโรคเดิมได้ตรวจซูม 5 ตำแหน่งด้วย 2 โมเดลเพิ่มเติมแล้ว กรอบที่พบใหม่ยังต้องตรวจความถูกต้องก่อนใช้เทรน';const q=new URLSearchParams(location.search);if(q.get('group'))$('group').value=q.get('group');if(q.get('status'))$('status').value=q.get('status');apply();}).catch(e=>$('summary').textContent='โหลดผลไม่สำเร็จ: '+e.message);
</script></html>
