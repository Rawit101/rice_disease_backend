services:
  # Service 1: LINE Bot (Node.js)
  - type: web
    name: rice-disease-bot
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LINE_TOKEN
        sync: false
      - key: CHANNEL_ACCESS_TOKEN
        sync: false
      - key: CHANNEL_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # ชี้ไปที่ Python API service บน Render
      - key: YOLO_API_URL
        sync: false
      - key: YOLO_CONFIDENCE_THRESHOLD
        value: "0.25"

  # Service 2: YOLO best.pt detection API (PyTorch; legacy RAG disabled)
  - type: web
    name: rice-disease-api
    runtime: docker
    dockerfilePath: ./render-api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "5000"
      - key: ENABLE_RAG
        value: "false"
      - key: YOLO_CONFIDENCE_THRESHOLD
        value: "0.25"
