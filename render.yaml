services:
  # Service 1: LINE Bot (Node.js)
  - type: web
    name: rice-disease-bot
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LINE_TOKEN
        sync: false
      - key: CHANNEL_ACCESS_TOKEN
        sync: false
      - key: CHANNEL_SECRET
        sync: false
      - key: MAXPLUS_API_KEY
        sync: false
      - key: MAXPLUS_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: BASE_URL
        sync: false
      # ชี้ไปที่ Python API service บน Render
      - key: YOLO_API_URL
        sync: false
      - key: RAG_API_URL
        sync: false

  # Service 2: YOLO + RAG API (Python ONNX)
  - type: web
    name: rice-disease-api
    runtime: docker
    dockerfilePath: ./render-api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "5000"
      - key: GEMINI_API_KEY
        sync: false
      - key: MAXPLUS_API_KEY
        sync: false
      - key: MAXPLUS_BASE_URL
        sync: false
